name: Preview deployment comment

on:
  deployment_status:

permissions:
  pull-requests: write
  deployments: read

jobs:
  comment:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert preview URL on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deployment-comment -->';
            const sha = context.payload.deployment.sha.slice(0, 7);
            const url = context.payload.deployment_status.target_url;
            const deployedAt = new Date(context.payload.deployment_status.updated_at).toISOString();
            const body = [
              marker,
              `## Preview deployment (\`${sha}\`)`,
              '',
              `**Preview URL:** ${url}`,
              '',
              `Deployed at ${deployedAt} UTC.`,
              '',
              '_This comment updates automatically when Vercel finishes a preview deployment._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.payload.deployment.sha,
            });

            for (const pr of prs.data) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existing = comments.find((comment) => comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
